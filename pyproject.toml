[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zimg-f64-validation"
version = "0.1.0"
description = "Validation tools for the zimg binary64 Spline36 reference path"
requires-python = ">=3.11"
license = "WTFPL"
dependencies = []

[project.optional-dependencies]
validation = [
  "hypothesis>=6.0",
  "mpmath>=1.3",
  "numpy>=2.0",
  "pytest>=8.0",
  "scipy>=1.13",
  "sympy>=1.13",
]
quality = [
  "mypy>=1.10",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/f64"]
markers = [
  "integration: generates and processes the full deterministic 4K fixture",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tools", "tests/f64"]

[[tool.mypy.overrides]]
module = ["mpmath", "scipy", "sympy"]
ignore_missing_imports = true

[tool.setuptools]
py-modules = []
